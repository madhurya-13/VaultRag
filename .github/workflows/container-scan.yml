name: Container scan

on:
  workflow_dispatch:
  push:
    paths: ["backend/Dockerfile", "frontend/Dockerfile", "docker-compose.yml", ".github/workflows/container-scan.yml"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository configuration and dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t vaultrag-backend:scan .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vaultrag-backend:scan
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t vaultrag-frontend:scan .
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vaultrag-frontend:scan
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
