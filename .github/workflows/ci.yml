name: VaultRAG CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-secret-value-long-enough-for-tests-0123456789
      DATABASE_URL: postgresql+psycopg://vaultrag_app:ci_app_password@localhost:5432/vaultrag
      MIGRATION_DATABASE_URL: postgresql+psycopg://vaultrag_migrator:ci_migrator_password@localhost:5432/vaultrag
      TEST_DATABASE_URL: postgresql+psycopg://vaultrag_app:ci_app_password@localhost:5432/vaultrag_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://vaultrag_migrator:ci_migrator_password@localhost:5432/vaultrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies and scanners
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          python -m pip install -r requirements-dev.txt
      - name: Create PostgreSQL databases, pgvector and restricted roles
        run: |
          PGPASSWORD=ci_postgres_password psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vaultrag'
          PGPASSWORD=ci_postgres_password psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vaultrag_test'
          for database in vaultrag vaultrag_test; do
            PGPASSWORD=ci_postgres_password psql -h localhost -U postgres -d "$database" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA extensions; CREATE EXTENSION vector SCHEMA extensions'
            PGPASSWORD=ci_postgres_password psql -h localhost -U postgres -d "$database" -v app_password=ci_app_password -v migrator_password=ci_migrator_password -f ../database/bootstrap_roles.sql
          done
      - name: Ruff lint
        run: |
          ruff check app --exclude app/tests
          ruff check ../tests/security
      - name: Bandit high severity scan
        run: bandit -r app -ll -x app/tests
      - name: Python dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: PostgreSQL RLS integration and security tests
        run: pytest -q
      - name: Dedicated Milestone 6 security suite
        run: pytest -q ../tests/security

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - name: Production build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
