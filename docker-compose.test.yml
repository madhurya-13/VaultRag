services:
  performance:
    profiles: ["performance"]
    image: vaultrag-m6-locust
    entrypoint: ["locust"]
    command:
      - "-f"
      - "/load/locustfile.py"
      - "--host"
      - "http://web:8080"
      - "--headless"
      - "--users"
      - "5"
      - "--spawn-rate"
      - "1"
      - "--run-time"
      - "2m"
      - "--only-summary"
      - "--csv"
      - "/results/baseline"
    environment:
      VAULTRAG_USERS_CSV: /run/users.csv
      VAULTRAG_REQUEST_HOST: localhost
      VAULTRAG_RAG_WEIGHT: ${VAULTRAG_RAG_WEIGHT:-2}
      VAULTRAG_UPLOAD_WEIGHT: ${VAULTRAG_UPLOAD_WEIGHT:-1}
    volumes:
      - ./tests/performance/locustfile.py:/load/locustfile.py:ro
      - ./.locust-users.csv:/run/users.csv:ro
      - ./docs/performance/results:/results
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend_access]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  security-tests:
    image: vaultrag-m6-api
    working_dir: /app
    entrypoint: ["python", "-m", "pytest"]
    command: ["-p", "no:cacheprovider", "-q", "/app/tests/security"]
    environment:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://vaultrag_app:${APP_DB_PASSWORD}@db:5432/vaultrag_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://vaultrag_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/vaultrag_test
      DATABASE_URL: postgresql+psycopg://vaultrag_app:${APP_DB_PASSWORD}@db:5432/vaultrag_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://vaultrag_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/vaultrag_test
      JWT_SECRET_KEY: test-only-jwt-secret-0123456789abcdef0123456789abcdef
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      DOCUMENT_STORAGE_DIR: /tmp/vaultrag-test-documents
    volumes:
      - ./tests:/app/tests:ro
      - ./backend/app/tests:/app/app/tests:ro
      - ./frontend/src:/app/frontend/src:ro
      - vaultrag_models:/var/cache/vaultrag
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
